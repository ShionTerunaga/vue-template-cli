name: Create GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: create-github-release
  cancel-in-progress: true

jobs:
  github-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26

      - name: Create or update GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin release
          TARGET_SHA="$(git rev-parse origin/release)"
          VERSION="$(git show origin/release:package.json | node --input-type=commonjs --print 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          export TARGET_SHA
          export VERSION
          node scripts/release/sync-github-release.mts
