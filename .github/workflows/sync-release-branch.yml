name: Sync Release Branch

on:
    pull_request_target:
        types:
            - closed
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: sync-release-branch
    cancel-in-progress: true

jobs:
    sync-release:
        if: >
            github.event.pull_request.merged == true &&
            startsWith(github.event.pull_request.head.ref, 'changeset-release/')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout main
              uses: actions/checkout@v6.0.2
              with:
                  fetch-depth: 0
                  ref: main

            - name: Setup pnpm
              uses: pnpm/action-setup@v6.0.8
              with:
                  version: 10.18.3

            - name: Setup Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: 26
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Configure git author
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Prepare release branch
              id: sync-release
              run: |
                  git fetch origin main
                  git checkout -B release origin/main
                  PREPARE_RELEASE_BRANCH=1 pnpm prepare:release-branch
                  git add --all
                  git commit -m "chore: prepare release branch"
                  git push origin HEAD:release --force
                  echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  release_version="$(node --print 'require("./package.json").version')"
                  echo "version=$release_version" >> "$GITHUB_OUTPUT"

            - name: Restore main branch
              run: git checkout main

            - name: Create or update GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TARGET_SHA: ${{ steps.sync-release.outputs.release_sha }}
                  VERSION: ${{ steps.sync-release.outputs.version }}
              run: |
                  node scripts/release/sync-github-release.mts
