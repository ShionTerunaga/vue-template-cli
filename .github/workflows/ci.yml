name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Validate Vue CLI and templates
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Setup pnpm
              uses: pnpm/action-setup@v6.0.8
              with:
                  version: 10.18.3

            - name: Setup Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: 26
                  cache: pnpm

            - name: Setup uv
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  enable-cache: true

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm exec tsc --noEmit

            - name: Format check
              run: pnpm format:check

            - name: Lint
              run: pnpm lint:check

            - name: Build and test generated Vue templates
              run: pnpm test:e2e
